# DigitalOcean App Platform spec — lifeline-mcp
# Deploy: doctl apps create --spec backend/deploy/digitalocean/mcp.yaml
# No env/secrets. The FastMCP HTTP app has NO /health route, so health_check is
# omitted → App Platform uses a TCP readiness check on http_port. The public
# HTTPS URL is the raw MCP endpoint the TF virtual-MCP points at.
name: lifeline-mcp
region: nyc
services:
  - name: mcp
    github:
      repo: aditya1rawat/tfy-aws-ra-hackathon-2026
      branch: main
      deploy_on_push: false
    source_dir: backend
    dockerfile_path: backend/deploy/Dockerfile.mcp
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
