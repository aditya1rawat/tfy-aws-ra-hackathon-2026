# DigitalOcean App Platform spec — lifeline-bridge
# Deploy LAST (depends on guardrail + mcp + TF virtual-MCP URLs).
# Deploy: doctl apps create --spec backend/deploy/digitalocean/bridge.yaml
#
# Secrets are NOT committed. Fill the SECRET values in the DO console (Apps →
# lifeline-bridge → Settings → Environment) or with `doctl apps update`, then
# redeploy. Replace the <…> placeholders below before first create, or set them
# in the console.
name: lifeline-bridge
region: nyc
services:
  - name: bridge
    github:
      repo: aditya1rawat/tfy-aws-ra-hackathon-2026
      branch: feat/phaseB1-live-tf
      deploy_on_push: false
    source_dir: backend
    dockerfile_path: backend/deploy/Dockerfile.bridge
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /health
    envs:
      - key: USE_TF
        value: "true"
      - key: TF_GATEWAY_BASE_URL
        value: "https://gateway.truefoundry.ai"
      - key: TF_PRIMARY_MODEL
        value: "aws-bedrock/global.anthropic.claude-sonnet-4-6"
      - key: TF_FALLBACK_MODEL
        value: "aws-bedrock/us.meta.llama4-scout-17b-instruct-v1-0"
      - key: GUARDRAIL_URL
        value: "https://lifeline-guardrail-amdnu.ondigitalocean.app"
      # Routed through the TF MCP Gateway (auth: TF_API_KEY bearer): tool calls are
      # audited + scoped at the gateway, and insurer_cancel_auth is disabled there
      # (the scoped-permission beat). Falls back to the raw DO mcp URL if needed:
      # https://lifeline-mcp-gkjbn.ondigitalocean.app/mcp
      - key: MCP_GATEWAY_URL
        value: "https://gateway.truefoundry.ai/adityarawat/mcp/lifeline-tfy-aws-ra-hackathon/server"
      # --- secrets: set type=SECRET, fill values in the console, do not commit ---
      - key: TF_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set in console>"
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: "<Neon pooled DSN>"
      - key: HYDRADB_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<set in console>"
      - key: HYDRADB_TENANT_ID
        scope: RUN_TIME
        type: SECRET
        value: "<set in console>"
      - key: HYDRADB_SUB_TENANT_ID
        scope: RUN_TIME
        value: ""
